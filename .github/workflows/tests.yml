name: tests

# Runs the offline test suite on every push and pull request.
#
# The suite uses stand-in programs in place of the real Claude and Codex CLIs,
# so this needs no credentials, makes no network calls, and costs nothing. The
# live verification in canaries/ is deliberately NOT run here: it spends real
# model calls and needs signed-in CLIs, which is a human's decision to make.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-suite:
    strategy:
      fail-fast: false
      matrix:
        # The suite inspects processes, so every implementation runs here.
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    # bash everywhere, on purpose. GitHub's default shell on Windows is pwsh,
    # and a native command that exits nonzero does not stop a pwsh step: only
    # the LAST command's exit status is reported for a multi-line step, so
    # every earlier failing test file in a step was silently passed over and
    # the Windows matrix could go green with failures in it. bash -e stops at
    # the first failure on every runner. Steps that need cmd or python say so.
    #
    # Known cost of bash on Windows, measured in run 34936853093: a process
    # under Git bash inherits SeBackupPrivilege and SeRestorePrivilege ENABLED,
    # which bypass the DACL for the operations the deny-ACE test fixtures
    # restrict. The test harness removes both from its own token at import
    # (tests/platform_support.py) so the tests run as an ordinary account.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: No third-party dependencies, by design
        shell: bash
        run: |
          python3 -c "import sys; print(sys.version)"
          test ! -f requirements.txt || (echo "unexpected dependencies" && exit 1)

      - name: Platform self-report
        shell: python
        run: |
          import sys, json, tempfile, os
          sys.path.insert(0, "src")
          from agent_bridge.platform import platform
          print("implementation:", type(platform).__name__)
          print("supports_owner_only_permissions:",
                platform.supports_owner_only_permissions)
          from agent_bridge import store
          store.set_umask()
          d = store.secure_mkdir(tempfile.mkdtemp())
          probe = os.path.join(d, "probe")
          # Use the real writer, not a bare open(): a bare open gets default
          # permissions and produces a false negative.
          store.atomic_write_bytes(probe, b"probe\n")
          try:
              verified, detail = platform.verify_owner_only_path(d, probe)
              print("verify_owner_only_path:", verified, json.dumps(detail))
          except Exception as exc:
              print("verify_owner_only_path raised:", type(exc).__name__, exc)
          if os.name == "nt" and hasattr(platform, "acl_diagnostics"):
              print("acl_diagnostics:", json.dumps(platform.acl_diagnostics(d),
                                                   indent=2))
          if os.name == "nt":
              import subprocess
              for target in (d, probe):
                  r = subprocess.run(["icacls", target], capture_output=True)
                  print(f"icacls {target} rc={r.returncode}")
                  print(r.stdout.decode(errors="replace"))
                  print(r.stderr.decode(errors="replace"))
              import getpass
              print("user:", getpass.getuser())

      - name: Offline test suite
        run: python3 tests/test_suite.py

      - name: Portable onboarding and optional local worker
        run: |
          python3 -m unittest discover -s tests -p "test_onboard.py"
          python3 -m unittest discover -s tests -p "test_local_worker.py"
          python3 setup_bridge.py --help

      - name: Security regression tests
        run: python3 -m unittest discover -s tests -p "test_*security*.py"

      - name: Portable orchestration tests
        run: |
          python3 -m unittest discover -s tests -p "test_capacity_router.py"
          python3 -m unittest discover -s tests -p "test_execution_dispatcher.py"
          python3 -m unittest discover -s tests -p "test_localq.py"
          python3 -m unittest discover -s tests -p "test_localq_intake.py"
          python3 -m unittest discover -s tests -p "test_checkpoint.py"
          python3 -m unittest discover -s tests -p "test_gemma_certified.py"
          python3 -m unittest discover -s tests -p "test_localq_server.py"
          python3 -m unittest discover -s tests -p "test_orchestration_server.py"
          python3 -m unittest discover -s tests -p "test_delegation_gate.py"
          python3 -m unittest discover -s tests -p "test_system_acceptance.py"

      - name: Automatic routing, the gate that applies it, and its audit
        run: |
          python3 -m unittest discover -s tests -p "test_hostenv.py"
          python3 -m unittest discover -s tests -p "test_automatic_gate.py"
          python3 -m unittest discover -s tests -p "test_delegation_audit.py"

      - name: Guided automatic-delegation opt-in
        run: |
          python3 -m unittest discover -s tests -p "test_automatic_delegation.py"
          # The opt-in check must never drain the user's real queue. This runs
          # everywhere because the defect was in pure orchestration, not in
          # anything platform-specific.
          python3 -m unittest discover -s tests -p "test_delegation_verify_isolation.py"

      # Every Windows delegation component is pure or takes an injected
      # platform seam, so the whole set runs on all three runners. That is the
      # point: a Windows-only test that only ever runs on one runner is a test
      # that stops being read.
      - name: Windows delegation components (portable)
        # Host-side components run on every runner. The in-guest runner's
        # own process behaviour (test_guest_runner's execution classes,
        # test_capture_diff, test_auth_probe's lifecycle) executes only inside
        # the Linux guest and skips itself, by name, on a Windows host; the
        # validators and constants those files also cover still run there.
        run: |
          python3 -m unittest discover -s tests -p "test_windows_wsl.py"
          python3 -m unittest discover -s tests -p "test_windows_preflight.py"
          python3 -m unittest discover -s tests -p "test_windows_wsl_runtime.py"
          python3 -m unittest discover -s tests -p "test_windows_wsl_provision.py"
          python3 -m unittest discover -s tests -p "test_windows_activation.py"
          python3 -m unittest discover -s tests -p "test_windows_rootfs.py"
          python3 -m unittest discover -s tests -p "test_windows_delegation.py"
          python3 -m unittest discover -s tests -p "test_guest_runner.py"
          python3 -m unittest discover -s tests -p "test_windows_evidence.py"
          python3 -m unittest discover -s tests -p "test_windows_auth.py"
          python3 -m unittest discover -s tests -p "test_windows_privacy.py"
          python3 -m unittest discover -s tests -p "test_windows_provision_driver.py"
          python3 -m unittest discover -s tests -p "test_signing.py"
          python3 -m unittest discover -s tests -p "test_auth_probe.py"
          python3 -m unittest discover -s tests -p "test_workspace_packing.py"
          python3 -m unittest discover -s tests -p "test_workspace_unpacking.py"
          python3 -m unittest discover -s tests -p "test_capture_diff.py"
          python3 -m unittest discover -s tests -p "test_verification_egress.py"
          python3 -m unittest discover -s tests -p "test_brief_and_base_binding.py"
          python3 -m unittest discover -s tests -p "test_execution_outcome_contract.py"
          python3 -m unittest discover -s tests -p "test_claude_config_dir.py"
          # The production entrypoint. Listed here rather than left to a local
          # run, because a regression suite for a command nobody runs in CI is
          # the same gap this command was built to close.
          python3 -m unittest discover -s tests -p "test_windows_setup.py"
          # The executor-selection seam is the one place a Windows host picks
          # the WSL2 lane, so it runs on the Windows runner too. The mode-bit
          # assertions inside go through the platform ACL check there rather
          # than being skipped.
          python3 -m unittest discover -s tests -p "test_execution_worker.py"

      # These used to be macOS-only, because both harnesses hard-coded the
      # standalone Command Line Tools git path and refused any non-Darwin host
      # outright. That is exactly why the portability defect survived: the only
      # tests that would have caught it never ran anywhere it was broken.
      # execution/hostenv.py resolves git per host and selects a verification
      # confinement backend, so they now run on macOS and Linux and assert what
      # the *selected* backend claims rather than macOS semantics everywhere.
      - name: Execution-lane harness tests
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s tests -p "test_claude_task.py"
          python3 -m unittest discover -s tests -p "test_codex_task.py"

      # The whole workflow, through the installed hook, the MCP server as a
      # subprocess, the real queue and both real harnesses, with stand-in
      # provider executables. Skips itself by name on a host with no
      # confinement backend rather than passing vacuously.
      - name: Complete automatic-delegation workflow, end to end
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p "test_automatic_delegation_e2e.py"

      - name: macOS-only runtime probes
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p "test_localq_runtime.py"

      - name: Windows command launcher smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          bin\agent-bridge-windows-setup.cmd plan --runtime-root "%TEMP%\agent-bridge-ci" > windows-setup.json
          python -c "import json; d=json.load(open('windows-setup.json')); assert d['command']=='plan'"

      - name: Deterministic Windows validation and signing regressions
        run: |
          python3 -m unittest discover -s tests -p "test_windows_validation.py"
          python3 -m unittest discover -s tests -p "test_windows_semantics.py"
          python3 -m unittest discover -s tests -p "test_success_gate_unity.py"
          python3 -m unittest discover -s tests -p "test_release_signing.py"

      - name: The repository holds no private key
        shell: bash
        run: python3 tools/release_signing.py scan

      - name: The signed test image is reproducible
        shell: bash
        run: python3 tools/make_test_image.py --check

      - name: Provider-lane fixtures run the real subprocess path
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p "test_provider_lane_fixtures.py"

      - name: Setup reports cleanly with no CLIs installed
        shell: bash
        run: |
          # Neither CLI exists on a runner, so this must fail informatively
          # rather than crash. Exit code 1 is the documented "not ready" signal.
          ./bin/agent-bridge-setup && rc=0 || rc=$?
          test "$rc" = "1" || (echo "expected exit 1, got $rc" && exit 1)

      - name: MCP server starts and lists the right tools
        shell: bash
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | ./bin/agent-bridge-mcp --caller codex > out.json
          python3 - <<'PY'
          import json
          names = set()
          for line in open("out.json"):
              line = line.strip()
              if not line:
                  continue
              msg = json.loads(line)
              if msg.get("id") == 2:
                  names = {t["name"] for t in msg["result"]["tools"]}
          expected = {f"claude_{v}" for v in
                      ("start", "continue", "poll", "read", "close")}
          assert names == expected, f"got {sorted(names)}"
          assert not any(n.startswith("codex_") for n in names), \
              "a caller must not be able to consult its own model"
          print("tool exposure correct:", sorted(names))
          PY
