name: tests

# Runs the offline test suite on every push and pull request.
#
# The suite uses stand-in programs in place of the real Claude and Codex CLIs,
# so this needs no credentials, makes no network calls, and costs nothing. The
# live verification in canaries/ is deliberately NOT run here: it spends real
# model calls and needs signed-in CLIs, which is a human's decision to make.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Windows is not supported. This job proves the refusal is clean and the
  # message is useful on a real Windows machine, rather than asserting it from
  # a Mac. If someone later ports the platform layer, this job is where the
  # evidence that it works would go.
  windows-refuses-cleanly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Importing the package raises a useful refusal, not an ImportError
        shell: python
        run: |
          import sys, traceback
          sys.path.insert(0, "src")
          try:
              import agent_bridge
          except RuntimeError as exc:
              message = str(exc)
              print(message)
              required = ["POSIX", "macOS or Linux", "WSL", "safety machinery",
                          "stubbing", "fcntl", "killpg", "fchmod", "selectors"]
              missing = [r for r in required if r not in message]
              assert not missing, f"refusal message missing: {missing}"
              print("\nrefusal is clean and complete")
          except ImportError as exc:
              print("FAILED: raised a bare ImportError instead of the guard")
              traceback.print_exc()
              sys.exit(1)
          else:
              print("FAILED: imported successfully on an unsupported platform")
              sys.exit(1)

  offline-suite:
    strategy:
      fail-fast: false
      matrix:
        # Built and measured on macOS. Linux is included because the suite
        # inspects processes, and that is exactly the kind of code that grows
        # silent platform assumptions.
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: No third-party dependencies, by design
        run: |
          python3 -c "import sys; print(sys.version)"
          test ! -f requirements.txt || (echo "unexpected dependencies" && exit 1)

      - name: Offline test suite
        run: python3 tests/test_suite.py

      - name: Setup reports cleanly with no CLIs installed
        run: |
          # Neither CLI exists on a runner, so this must fail informatively
          # rather than crash. Exit code 1 is the documented "not ready" signal.
          ./bin/agent-bridge-setup && rc=0 || rc=$?
          test "$rc" = "1" || (echo "expected exit 1, got $rc" && exit 1)

      - name: MCP server starts and lists the right tools
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | ./bin/agent-bridge-mcp --caller codex > out.json
          python3 - <<'PY'
          import json
          names = set()
          for line in open("out.json"):
              line = line.strip()
              if not line:
                  continue
              msg = json.loads(line)
              if msg.get("id") == 2:
                  names = {t["name"] for t in msg["result"]["tools"]}
          expected = {f"claude_{v}" for v in
                      ("start", "continue", "poll", "read", "close")}
          assert names == expected, f"got {sorted(names)}"
          assert not any(n.startswith("codex_") for n in names), \
              "a caller must not be able to consult its own model"
          print("tool exposure correct:", sorted(names))
          PY
